# ==============================================================================
# ARES MAINFRAME // CYBER-RED KITTY CONFIG
# Retro terminal: vermelho (estrutura) + ciano (dados)
# ==============================================================================

# Font Configuration
font_family      3270 Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        13
# ícones Nerd Font ocupam 1 célula (não encavalam no texto do yazi, fastfetch etc.)
narrow_symbols U+E000-U+F8FF,U+F0000-U+FFFFF 1

# Geometry & Borders
window_padding_width 12
window_border_width  1.0pt
active_border_color   #ff1f3d
inactive_border_color #3a1018
draw_minimal_borders  yes
hide_window_decorations yes

# Estilo holograma: fundo translúcido, o wallpaper ASCII aparece nítido atrás
background_opacity   0.68
dynamic_background_opacity yes
confirm_os_window_close 0

# Cursor Styling (Blinking Red Block)
cursor               #ff1f3d
cursor_text_color    #08060a
cursor_shape         block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Mouse & Selection
mouse_hide_wait      3.0
url_color            #00f0ff
url_style            straight
open_url_with        default
copy_on_select       yes
selection_foreground #ffffff
selection_background #8f1426

# Bell
enable_audio_bell    no
visual_bell_duration 0.0

# Tab Bar
tab_bar_edge         top
tab_bar_style        separator
tab_separator        " │ "
active_tab_foreground   #08060a
active_tab_background   #ff1f3d
active_tab_font_style   bold
inactive_tab_foreground #7a6f73
inactive_tab_background #100a0e
inactive_tab_font_style normal

# ------------------------------------------------------------------------------
# Color Palette: ARES Cyber-Red (vermelho + ciano)
# ------------------------------------------------------------------------------
background           #08060a
foreground           #e8e2e4

# Black
color0               #1a0f14
color8               #4a3a40

# Red
color1               #ff1f3d
color9               #ff5a6e

# Green
color2               #2bd9a0
color10              #6ff2c4

# Yellow / Amber
color3               #ffb000
color11              #ffd166

# Blue
color4               #2a7fff
color12              #6aa8ff

# Magenta
color5               #ff2a8a
color13              #ff70b3

# Cyan
color6               #00f0ff
color14              #7af8ff

# White
color7               #c9c0c4
color15              #ffffff
