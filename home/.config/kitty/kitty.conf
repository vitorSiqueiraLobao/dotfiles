# ==============================================================================
# ARES MAINFRAME // TITANIUM MONOLITH KITTY CONFIG
# High-contrast architectural monochrome
# ==============================================================================

# Font Configuration
font_family      JetBrainsMono Nerd Font
bold_font        JetBrainsMono Nerd Font Bold
italic_font      JetBrainsMono Nerd Font Italic
bold_italic_font JetBrainsMono Nerd Font Bold Italic
font_size        11.5

# Geometry & Borders
window_padding_width 12
window_border_width  1.0pt
active_border_color   #eaeaea
inactive_border_color #1a1a1a
draw_minimal_borders  yes
hide_window_decorations yes
confirm_os_window_close 0

# Cursor Styling (Titanium Solid Blinking Block)
cursor               #eaeaea
cursor_text_color    #050505
cursor_shape         block
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# Mouse & Selection
mouse_hide_wait      3.0
url_color            #ffffff
url_style            straight
open_url_with        default
copy_on_select       yes
selection_foreground #050505
selection_background #eaeaea

# Bell
enable_audio_bell    no
visual_bell_duration 0.0

# Tab Bar
tab_bar_edge         top
tab_bar_style        separator
tab_separator        " │ "
active_tab_foreground   #050505
active_tab_background   #eaeaea
active_tab_font_style   bold
inactive_tab_foreground #666666
inactive_tab_background #0e0e0e
inactive_tab_font_style normal

# ------------------------------------------------------------------------------
# Color Palette: Titanium Monolith (Zero Saturation, Maximum Clarity)
# ------------------------------------------------------------------------------
background           #050505
foreground           #eaeaea

# Black
color0               #121212
color8               #2a2a2a

# Red
color1               #cf4f4f
color9               #e26d6d

# Green
color2               #52b788
color10              #74c69d

# Yellow / Amber
color3               #d4a259
color11              #e5b974

# Blue / Titanium
color4               #999999
color12              #cccccc

# Magenta
color5               #888888
color13              #aaaaaa

# Cyan / Ice
color6               #b0b0b0
color14              #e0e0e0

# White / Off-white
color7               #d4d4d4
color15              #ffffff
