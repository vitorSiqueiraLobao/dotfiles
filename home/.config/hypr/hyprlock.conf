# ==============================================================================
# ARES // HYPRLOCK — minimal
# Customize pelas variáveis abaixo. Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# ==============================================================================

# --- Aparência ---------------------------------------------------------------
$font       = JetBrainsMono Nerd Font
$text       = rgba(234, 234, 234, 1.0)    # texto principal
$muted      = rgba(234, 234, 234, 0.45)   # texto secundário
$accent     = rgba(234, 234, 234, 0.9)    # borda do campo de senha
$fail       = rgba(207, 79, 79, 1.0)      # erro de senha
$wallpaper  = /home/w0lf/.config/hypr/wallpaper.png
$blur       = 3                           # 0 = sem desfoque
$dim        = 0.45                        # brilho do fundo (0 a 1)
$clock_size = 120

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 4, ease
    animation = fadeOut, 1, 4, ease
    animation = inputFieldDots, 1, 2, ease
}

# --- Fundo -------------------------------------------------------------------
background {
    monitor =
    path = $wallpaper
    color = rgba(8, 8, 8, 1.0)
    blur_passes = $blur
    blur_size = 6
    brightness = $dim
    noise = 0.01
}

# --- Relógio -----------------------------------------------------------------
label {
    monitor =
    text = $TIME
    color = $text
    font_size = $clock_size
    font_family = $font
    position = 0, 140
    halign = center
    valign = center
}

# --- Data --------------------------------------------------------------------
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock_date.sh
    color = $muted
    font_size = 16
    font_family = $font
    position = 0, 40
    halign = center
    valign = center
}

# --- Senha -------------------------------------------------------------------
input-field {
    monitor =
    size = 280, 42
    outline_thickness = 1
    rounding = 0
    outer_color = $accent
    inner_color = rgba(10, 10, 10, 0.55)
    font_color = $text
    font_family = $font
    check_color = $accent
    fail_color = $fail
    dots_size = 0.22
    dots_spacing = 0.35
    dots_center = true
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <span foreground="##ffffff66">senha</span>
    fail_text = <span foreground="##cf4f4f">senha incorreta</span>
    fail_timeout = 2000
    position = 0, -60
    halign = center
    valign = center
}

# --- Usuário -----------------------------------------------------------------
label {
    monitor =
    text = $USER
    color = $muted
    font_size = 11
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
