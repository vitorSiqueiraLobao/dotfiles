    font_size = 22
    font_family = $font
    position = -1500, -60
    halign = center
    valign = center
    zindex = 3
}

# --- Centro: relógio + BUFFER (campo de senha) -------------------------------
label {
    monitor =
    text = $TIME
    color = $cyan
    font_size = 120
    font_family = $font
    position = 0, 170
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock_date.sh
    color = $text
    font_size = 18
    font_family = $font
    position = 0, 60
    halign = center
    valign = center
}

label {
    monitor =
    text = BUFFER
    color = $red
    font_size = 16
    font_family = $font
    position = 0, -10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 560, 58
    outline_thickness = 1
    rounding = 0
    outer_color = $red
    inner_color = $panel
    font_color = $cyan
    font_family = $font
    check_color = $cyan
    fail_color = $fail
    dots_size = 0.3
    dots_spacing = 0.45
    dots_center = true
    dots_rounding = 0
    fade_on_empty = false
    placeholder_text = <span foreground="##4a3a40">[  ][  ][  ][  ][  ][  ]</span>
    fail_text = <span foreground="##ffb000">BREACH FAILED // TENTATIVA $ATTEMPTS</span>
    fail_timeout = 2500
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = > digite a senha para iniciar o upload_
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, -130
    halign = center
    valign = center
}

