# ==============================================================================
# ARES // HYPRLOCK — BREACH PROTOCOL
# Layout inspirado no minigame de hacking do Cyberpunk 2077.
# Customize pelas variáveis abaixo. Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Para as cores do jogo, troque $red por rgba(208, 237, 87, 1.0) (amarelo-limão).
# ==============================================================================

# --- Aparência ---------------------------------------------------------------
$font       = 3270 Nerd Font
$red        = rgba(255, 31, 61, 1.0)      # estrutura: molduras, títulos
$red_dim    = rgba(255, 31, 61, 0.35)     # moldura externa
$cyan       = rgba(0, 240, 255, 1.0)      # dados: relógio, buffer, daemons
$text       = rgba(232, 226, 228, 1.0)
$muted      = rgba(122, 111, 115, 1.0)
$dark       = rgba(8, 6, 10, 1.0)         # texto sobre as faixas vermelhas
$panel      = rgba(16, 10, 14, 0.85)      # fundo dos painéis
$fail       = rgba(255, 176, 0, 1.0)      # senha errada (âmbar)
$wallpaper  = /home/w0lf/.config/hypr/wallpaper.png
$dim        = 0.18                        # brilho do fundo (0 a 1)

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 3, ease
    # sem fade-out: ao desbloquear, a tela sai na hora e a animação BREACH já está por cima
    animation = fadeOut, 0
    animation = inputFieldDots, 1, 1, ease
}

# --- Fundo -------------------------------------------------------------------
background {
    monitor =
    path = $wallpaper
    color = $dark
    blur_passes = 3
    blur_size = 6
    brightness = $dim
    noise = 0.02
}

# --- Moldura externa ---------------------------------------------------------
shape {
    monitor =
    size = 4960, 1200
    color = rgba(0, 0, 0, 0)
    border_size = 1
    border_color = $red_dim
    rounding = 0
    position = 0, -30
    halign = center
    valign = center
    zindex = 0
}

# --- Cabeçalho ---------------------------------------------------------------
label {
    monitor =
    text = ARES ▓▒░ NETTECH
    color = $red
    font_size = 18
    font_family = $font
    position = 90, -38
    halign = left
    valign = top
}

shape {
    monitor =
    size = 1600, 26
    color = $red
    rounding = 0
    position = 0, -40
    halign = center
    valign = top
    zindex = 1
}

label {
    monitor =
    text = BREACH PROTOCOL INTERFACE
    color = $dark
    font_size = 12
    font_family = $font
    position = 0, -43
    halign = center
    valign = top
    zindex = 2
}

label {
    monitor =
    text = DAEMON 4F2A-ARES-0X1F
    color = $muted
    font_size = 12
    font_family = $font
    position = -90, -42
    halign = right
    valign = top
}

# --- Painel esquerdo: tempo + CODE MATRIX ------------------------------------
label {
    monitor =
    text = BREACH TIME REMAINING
    color = $red
    font_size = 18
    font_family = $font
    position = -1610, 250
    halign = center
    valign = center
}

shape {
    monitor =
    size = 150, 44
    color = rgba(0, 0, 0, 0)
    border_size = 1
    border_color = $red
    rounding = 0
    position = -1290, 250
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = $TIME
    color = $cyan
    font_size = 20
    font_family = $font
    position = -1290, 250
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 640, 5
    color = $red
    rounding = 0
    position = -1500, 208
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 640, 460
    color = $panel
    border_size = 1
    border_color = $red
    rounding = 0
    position = -1500, -40
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor =
    size = 640, 38
    color = $red
    rounding = 0
    position = -1500, 171
    halign = center
    valign = center
    zindex = 2
}

label {
    monitor =
    text = ▦  CODE MATRIX
    color = $dark
    font_size = 16
    font_family = $font
    position = -1500, 171
    halign = center
    valign = center
    zindex = 3
}

label {
    monitor =
    text = cmd[update:3600000] ~/.config/hypr/scripts/breach_matrix.py --static
