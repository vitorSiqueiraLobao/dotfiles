# ==============================================================================
# ARES MAINFRAME // HYPRLOCK BRUTALIST LOCKSCREEN
# ==============================================================================

background {
    monitor =
    path = /home/w0lf/.config/hypr/wallpaper.png
    color = rgba(8, 8, 8, 1.0)
    blur_passes = 0
}

# Main Telemetry Box (ASCII Card)
label {
    monitor =
    text = cmd[update:1000] echo -e "┌──[ ARES // ACCESS RESTRICTED ]─────────────────────────┐\n│ USER: $USER @ $HOSTNAME\n│ TIME: $(date +'%H:%M:%S')  ──  DATE: $(date +'%Y.%m.%d')\n│ STATUS: LOCKED // AUTHENTICATION REQUIRED\n└────────────────────────────────────────────────────────┘"
    color = rgba(216, 216, 216, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font
    position = 0, 100
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 420, 46
    outline_thickness = 1
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    dots_rounding = 0
    outer_color = rgba(234, 234, 234, 1.0)
    inner_color = rgba(13, 13, 13, 1.0)
    font_color = rgba(240, 240, 240, 1.0)
    fade_on_empty = false
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <span foreground="##666666">INPUT KEY PHRASE_</span>
    hide_input = false
    rounding = 0
    check_color = rgba(234, 234, 234, 1.0)
    fail_color = rgba(207, 79, 79, 1.0)
    fail_text = <span foreground="##cf4f4f">ACCESS DENIED ($ATTEMPTS)</span>
    fail_transition = 200
    position = 0, -30
    halign = center
    valign = center
}

# Bottom Security Tag
label {
    monitor =
    text = [ TERMINAL INTERFACE // CRYPTOGRAPHIC LOCK ENGAGED ]
    color = rgba(100, 100, 100, 0.8)
    font_size = 10
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = bottom
}
