# ==============================================================================
# ARES // hypridle: o que acontece quando o PC fica parado
# Monitor OLED: a tela apaga cedo para evitar marcas (burn-in).
# Vídeo em tela cheia / chamadas seguram o idle sozinhos (idle inhibitor dos apps).
# ==============================================================================

general {
    lock_cmd = ARES_SILENT=1 $HOME/.config/hypr/scripts/lock.sh   # Breach Protocol, sem som
    before_sleep_cmd = loginctl lock-session                     # sempre trava antes de dormir
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
    ignore_dbus_inhibit = false
}

# 5 min: trava a sessão
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 6 min: apaga a tela (volta ao mexer no mouse/teclado)
listener {
    timeout = 360
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 30 min: suspende (dorme na RAM; acorda pelo teclado/mouse já no Breach Protocol)
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
