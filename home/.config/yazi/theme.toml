# ==============================================================================
# ARES MAINFRAME // yazi: tema Cyber-Red (vermelho = estrutura, ciano = dados)
# ==============================================================================

[mgr]
cwd = { fg = "#00f0ff", bold = true }
find_keyword  = { fg = "#00f0ff", bold = true, underline = true }
find_position = { fg = "#ff1f3d", bold = true }
symlink_target = { fg = "#7a6f73", italic = true }
marker_copied   = { fg = "#00f0ff", bg = "#00f0ff" }
marker_cut      = { fg = "#ff1f3d", bg = "#ff1f3d" }
marker_marked   = { fg = "#7af8ff", bg = "#7af8ff" }
marker_selected = { fg = "#ffb000", bg = "#ffb000" }
marker_symbol   = "▌"
count_copied   = { fg = "#08060a", bg = "#00f0ff" }
count_cut      = { fg = "#08060a", bg = "#ff1f3d" }
count_selected = { fg = "#08060a", bg = "#ffb000" }
border_symbol = "│"
border_style  = { fg = "#3a1018" }

[tabs]
active   = { fg = "#08060a", bg = "#ff1f3d", bold = true }
inactive = { fg = "#7a6f73", bg = "#1a0f14" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "░▒▓", close = "▓▒░" }

[mode]
normal_main = { fg = "#08060a", bg = "#ff1f3d", bold = true }
normal_alt  = { fg = "#ff1f3d", bg = "#1a0f14" }
select_main = { fg = "#08060a", bg = "#00f0ff", bold = true }
select_alt  = { fg = "#00f0ff", bg = "#1a0f14" }
unset_main  = { fg = "#08060a", bg = "#ffb000", bold = true }
unset_alt   = { fg = "#ffb000", bg = "#1a0f14" }

[indicator]
parent  = { fg = "#e8e2e4", bg = "#3a1018" }
current = { fg = "#08060a", bg = "#ff1f3d", bold = true }
preview = { fg = "#00f0ff", underline = true }
padding = { open = "", close = "" }

[status]
overall   = { bg = "#08060a" }
sep_left  = { open = "", close = "▓▒░" }
sep_right = { open = "░▒▓", close = "" }
perm_sep   = { fg = "#7a6f73" }
perm_type  = { fg = "#ff1f3d" }
perm_read  = { fg = "#00f0ff" }
perm_write = { fg = "#ff5a6e" }
perm_exec  = { fg = "#7af8ff" }
progress_label  = { fg = "#e8e2e4", bold = true }
progress_normal = { fg = "#ff1f3d", bg = "#1a0f14" }
progress_error  = { fg = "#ffb000", bg = "#3a1018" }

[which]
border          = { fg = "#ff1f3d" }
cols            = 3
mask            = { bg = "#08060a" }
cand            = { fg = "#00f0ff" }
rest            = { fg = "#7a6f73" }
desc            = { fg = "#ff5a6e" }
separator       = " ▸ "
separator_style = { fg = "#3a1018" }

[confirm]
border     = { fg = "#ff1f3d" }
title      = { fg = "#00f0ff", bold = true }
btn_yes    = { fg = "#08060a", bg = "#ff1f3d", bold = true }
btn_no     = { fg = "#7a6f73" }
btn_labels = [ "  [S]IM  ", "  (N)ÃO  " ]

[spot]
border   = { fg = "#ff1f3d" }
title    = { fg = "#00f0ff" }
tbl_col  = { fg = "#ff1f3d" }
tbl_cell = { fg = "#08060a", bg = "#00f0ff" }

[notify]
title_info  = { fg = "#00f0ff" }
title_warn  = { fg = "#ffb000" }
title_error = { fg = "#ff1f3d" }

[pick]
border   = { fg = "#ff1f3d" }
active   = { fg = "#00f0ff", bold = true }

[input]
border   = { fg = "#ff1f3d" }
title    = { fg = "#00f0ff" }
selected = { fg = "#08060a", bg = "#ff1f3d" }

[cmp]
border   = { fg = "#ff1f3d" }
active   = { fg = "#08060a", bg = "#ff1f3d" }

[tasks]
border  = { fg = "#ff1f3d" }
title   = { fg = "#00f0ff" }
hovered = { fg = "#00f0ff", bold = true }

[help]
border  = { fg = "#ff1f3d" }
chord   = { fg = "#00f0ff" }
hovered = { fg = "#08060a", bg = "#ff1f3d", bold = true }

[filetype]
rules = [
	{ mime = "**/image/*", fg = "#ff5a6e" },
	{ mime = "**/{audio,video}/*", fg = "#ff2a8a" },
	{ mime = "**/application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#ffb000" },
	{ mime = "**/application/{pdf,doc,rtf}", fg = "#7af8ff" },
	{ mime = "vfs/{absent,stale}", fg = "#7a6f73" },
	{ url = "*", is = "orphan", fg = "#ff1f3d", italic = true },
	{ url = "*", is = "exec", fg = "#00f0ff" },
	{ url = "*", is = "dummy", fg = "#ff1f3d", italic = true },
	{ url = "*/", is = "dummy", fg = "#ff1f3d", italic = true },
	{ url = "*/", fg = "#e8e2e4", bold = true },
	{ url = "*", fg = "#c9c0c4" },
]

