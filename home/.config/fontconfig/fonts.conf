<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Emoji: Noto Color Emoji como fallback logo depois da fonte principal -->
<fontconfig>
  <alias binding="weak">
    <family>sans-serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias binding="weak">
    <family>serif</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias binding="weak">
    <family>monospace</family>
    <accept><family>Noto Color Emoji</family></accept>
  </alias>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
</fontconfig>
